name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ "17", "21", "25" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Compile with -Werror, run integration tests on embedded Tomcat and package the WAR
        run: mvn -B verify

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build and start the container
        run: docker compose up -d --build

      - name: Sign in and check the role rules
        run: |
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 2; done
          ./scripts/smoke-test.sh http://localhost:8080

      - name: Container logs
        if: always()
        run: docker compose logs

      - name: Stop the container
        if: always()
        run: docker compose down
